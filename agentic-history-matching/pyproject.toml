[project]
name = "agentic-history-matching"
version = "0.1.0"
description = "Agentic history matching experiment."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fipy==4.0.3",
    "iterative-ensemble-smoother==1.3.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pydantic==2.14.3",
    "pydantic-ai-slim[openai]==2.69.0",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["ruff==0.17.4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
